# InstaSHAP Replication Configuration

# Random seed for reproducibility
random_seed: 42

# Datasets to use
datasets:
  adult:
    name: "Adult Income"
    task: "classification"
    test_size: 0.2
  california_housing:
    name: "California Housing"
    task: "regression"
    test_size: 0.2
  breast_cancer:
    name: "Breast Cancer"
    task: "classification"
    test_size: 0.2

# Black-box model configurations
black_box_models:
  random_forest:
    classification:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1
    regression:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1

  xgboost:
    classification:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      random_state: 42
      n_jobs: -1
    regression:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      random_state: 42
      n_jobs: -1

  lightgbm:
    classification:
      n_estimators: 100
      max_depth: 10
      learning_rate: 0.1
      random_state: 42
      n_jobs: -1
      verbose: -1
    regression:
      n_estimators: 100
      max_depth: 10
      learning_rate: 0.1
      random_state: 42
      n_jobs: -1
      verbose: -1

# GAM surrogate configuration
gam_config:
  max_iter: 5000
  max_bins: 256
  interactions: 0
  learning_rate: 0.01
  min_samples_leaf: 2
  random_state: 42

# SHAP computation configuration
shap_config:
  # Number of samples to compute exact SHAP for training GAM
  train_sample_size: 1000
  # Number of samples for testing GAM predictions
  test_sample_size: 500
  # Background dataset size for SHAP computation
  background_size: 100
  # Check additivity of SHAP values
  check_additivity: false

# Evaluation configuration
evaluation:
  # Metrics to compute
  metrics:
    - mse
    - mae
    - r2
    - pearson_correlation
    - spearman_correlation
  # Number of runs for timing experiments
  timing_runs: 5
  # Top-k features for ranking comparison
  top_k_features: 10

# Visualization configuration
visualization:
  figure_format: "png"
  dpi: 300
  style: "seaborn-v0_8-darkgrid"
  figure_size: [10, 6]
  save_figures: true

# Computation settings
computation:
  # Use GPU if available
  use_gpu: false
  # Number of parallel jobs
  n_jobs: -1
  # Batch size for SHAP computation
  batch_size: 100
  # Cache computed SHAP values
  cache_shap: true
